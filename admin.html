\<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Màn Hình Bếp & Lịch Sử Đơn Hàng</title>
    <style>
        :root {
            --bg-dark: #121214;
            --card-bg: #1e1e24;
            --accent: #ff6b6b;
            --success: #00b894;
            --warning: #fdcb6e;
            --danger: #d63031;
            --text: #f5f6fa;
            --text-secondary: #b2bec3;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text); padding: 20px; }
        
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid #2d2d38; padding-bottom: 15px; flex-wrap: wrap; gap: 10px; }
        header h2 { font-size: 20px; color: var(--text); display: flex; align-items: center; gap: 10px; }
        
        /* Trạng thái kết nối mạng */
        .connection-status { font-size: 12px; padding: 4px 10px; border-radius: 10px; font-weight: bold; display: inline-flex; align-items: center; gap: 5px; }
        .status-online { background: rgba(0, 184, 148, 0.2); color: #00b894; }
        .status-offline { background: rgba(214, 48, 49, 0.2); color: #ff7675; }

        /* Menu chuyển đổi Tab */
        .tab-menu { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab-btn { background: #2d2d38; color: var(--text-secondary); border: none; padding: 10px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 14px; transition: all 0.2s; }
        .tab-btn.active { background: var(--accent); color: white; }

        .orders-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; }
        
        .order-card { background: var(--card-bg); border-radius: 14px; padding: 20px; box-shadow: 0 8px 24px rgba(0,0,0,0.3); border-top: 5px solid var(--accent); display: flex; flex-direction: column; justify-content: space-between; }
        .order-card.completed { border-top-color: var(--success); opacity: 0.75; }

        .order-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .table-tag { background: #ffeaa7; color: #d63031; font-weight: 800; font-size: 16px; padding: 4px 12px; border-radius: 8px; }
        .order-time { font-size: 13px; color: var(--text-secondary); }

        .item-list { list-style: none; margin-bottom: 15px; border-top: 1px solid #2d2d38; border-bottom: 1px solid #2d2d38; padding: 10px 0; max-height: 220px; overflow-y: auto; }
        .item-row { padding: 8px 0; border-bottom: 1px dashed rgba(255,255,255,0.05); }
        .item-row:last-child { border-bottom: none; }
        .item-name-qty { font-size: 15px; font-weight: 600; color: #fff; }
        .item-note { font-size: 13px; color: var(--warning); background: rgba(253, 203, 110, 0.1); padding: 4px 8px; border-radius: 6px; margin-top: 5px; display: inline-block; font-weight: 500; }

        .order-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; padding-top: 10px; }
        .total-price { font-size: 17px; font-weight: bold; color: var(--success); }
        
        .btn-done { background: var(--success); color: white; border: none; padding: 8px 16px; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .btn-done:hover { opacity: 0.9; }
        .status-badge-done { background: rgba(0, 184, 148, 0.2); color: var(--success); padding: 6px 12px; border-radius: 6px; font-weight: bold; font-size: 13px; }

        .empty-state { text-align: center; color: var(--text-secondary); margin-top: 50px; font-size: 16px; grid-column: 1 / -1; }
        .btn-clear-all { background: transparent; color: var(--danger); border: 1px solid var(--danger); padding: 6px 12px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 13px; }
        .btn-clear-all:hover { background: rgba(214, 48, 49, 0.1); }
    </style>
</head>
<body>
    <header>
        <h2>
            👨‍🍳 MÀN HÌNH BẾP 
            <span id="connectionStatus" class="connection-status status-offline">🔴 Đang kết nối lại...</span>
        </h2>
        <button class="btn-clear-all" onclick="xoaTatCa()">🗑️ Xóa Sạch Lịch Sử</button>
    </header>

    <!-- Các nút chuyển tab xem đơn -->
    <div class="tab-menu">
        <button class="tab-btn active" id="tabDangCho" onclick="chuyenTab('dang-cho')">⚡ Đơn Đang Chờ (<span id="countDangCho">0</span>)</button>
        <button class="tab-btn" id="tabLichSu" onclick="chuyenTab('lich-su')">📜 Lịch Sử Đã Xong (<span id="countLichSu">0</span>)</button>
    </div>

    <div class="orders-grid" id="orderGrid">
        <div class="empty-state">Đang tải dữ liệu...</div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let allOrders = [];
        let currentTab = 'dang-cho'; // Mặc định hiển thị tab đơn đang chờ

        const statusEl = document.getElementById('connectionStatus');

        // Kiểm tra trạng thái kết nối real-time
        socket.on('connect', () => {
            statusEl.className = 'connection-status status-online';
            statusEl.innerText = '🟢 Đã kết nối trực tiếp';
        });

        socket.on('disconnect', () => {
            statusEl.className = 'connection-status status-offline';
            statusEl.innerText = '🔴 Mất kết nối (Đang thử lại...)';
        });

        // Nhận dữ liệu lịch sử từ Server
        socket.on('cap-nhat-lich-su', (historyList) => {
            // Nếu có đơn mới và đang ở tab đang chờ, phát tiếng kêu
            let hasNewPending = historyList.some(o => o.status === 'dang-cho' && !allOrders.some(old => old.id === o.id && old.status === 'dang-cho'));
            if (hasNewPending && allOrders.length > 0) {
                new Audio('https://actions.google.com/sounds/v1/alarms/beep_short.ogg').play().catch(e => {});
            }

            allOrders = historyList;
            capNhatGiaoDien();
        });

        function chuyenTab(tab) {
            currentTab = tab;
            document.getElementById('tabDangCho').classList.toggle('active', tab === 'dang-cho');
            document.getElementById('tabLichSu').classList.toggle('active', tab === 'lich-su');
            capNhatGiaoDien();
        }

        function capNhatGiaoDien() {
            // Lọc danh sách theo tab
            const dangChoList = allOrders.filter(o => o.status === 'dang-cho');
            const lichSuList = allOrders.filter(o => o.status === 'hoan-thanh');

            document.getElementById('countDangCho').innerText = dangChoList.length;
            document.getElementById('countLichSu').innerText = lichSuList.length;

            const targetList = currentTab === 'dang-cho' ? dangChoList : lichSuList;
            const orderGrid = document.getElementById('orderGrid');

            if (targetList.length === 0) {
                orderGrid.innerHTML = `<div class="empty-state">${currentTab === 'dang-cho' ? '🎉 Hiện không có đơn hàng nào đang chờ!' : '📜 Chưa có lịch sử đơn hàng hoàn thành nào.'}</div>`;
                return;
            }

            orderGrid.innerHTML = '';

            targetList.forEach(data => {
                let itemsHTML = '';
                data.items.forEach(itemStr => {
                    let parts = itemStr.split(' (Ghi chú: ');
                    let mainNameQty = parts[0];
                    let noteText = parts[1] ? parts[1].replace(')', '') : '';

                    itemsHTML += `
                        <li class="item-row">
                            <div class="item-name-qty">🍽️ ${mainNameQty}</div>
                            ${noteText ? `<div class="item-note">⚠️ Ghi chú: ${noteText}</div>` : ''}
                        </li>
                    `;
                });

                const isCompleted = data.status === 'hoan-thanh';
                const card = document.createElement('div');
                card.className = `order-card ${isCompleted ? 'completed' : ''}`;
                card.innerHTML = `
                    <div>
                        <div class="order-header">
                            <span class="table-tag">BÀN ${data.table}</span>
                            <span class="order-time">⏰ ${data.time}</span>
                        </div>
                        <ul class="item-list">
                            ${itemsHTML}
                        </ul>
                    </div>
                    <div class="order-footer">
                        <span class="total-price">${data.total.toLocaleString('vi-VN')}đ</span>
                        ${isCompleted 
                            ? `<span class="status-badge-done">✅ Đã hoàn thành</span>` 
                            : `<button class="btn-done" onclick="hoanThanhDon('${data.id}')">Hoàn Thành</button>`
                        }
                    </div>
                `;
                orderGrid.appendChild(card);
            });
        }

        function hoanThanhDon(id) {
            socket.emit('hoan-thanh-don', id);
        }

        function xoaTatCa() {
            if (confirm('Bạn có chắc chắn muốn xóa sạch toàn bộ lịch sử đơn hàng không?')) {
                socket.emit('xoa-tat-ca-lich-su');
            }
        }
    </script>
</body>
</html>
